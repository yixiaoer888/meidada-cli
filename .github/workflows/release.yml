name: Release CLI

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun test src

      - name: Typecheck
        run: bun run typecheck

  native-assets:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-amd64
          - os: windows-latest
            target: windows-arm64
          - os: macos-latest
            target: darwin-amd64
          - os: macos-latest
            target: darwin-arm64
          - os: ubuntu-latest
            target: linux-amd64
          - os: ubuntu-latest
            target: linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build native release asset
        run: bun run build:native-assets
        env:
          MDD_NATIVE_TARGETS: ${{ matrix.target }}
          BUN_TMPDIR: ${{ runner.temp }}
          TMPDIR: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}

      - name: Upload native release asset
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: |
            out/assets/mdd-cli-*
            out/assets/checksums.txt

  package:
    needs: native-assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check release tag
        run: bun scripts/check-release-tag.ts

      - name: Download native release assets
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: out/native-artifacts

      - name: Assemble release assets
        run: |
          mkdir -p out/assets out/npm
          find out/native-artifacts -type f -name 'mdd-cli-*' -exec cp {} out/assets/ \;
          find out/native-artifacts -type f -name checksums.txt -exec cat {} \; | sort > out/assets/checksums.txt
          cp out/assets/checksums.txt checksums.txt
          test "$(find out/assets -type f -name 'mdd-cli-*' | wc -l)" -eq 6

      - name: Build npm package directory
        run: bun run package:dir

      - name: Build platform npm package directories
        run: bun run build:platform-packages

      - name: Pack platform npm packages
        run: |
          for directory in out/platform-packages/*; do
            npm pack "$directory" --ignore-scripts --pack-destination out/npm
          done

      - name: Pack npm package
        run: |
          npm pack ./out/package --ignore-scripts --pack-destination out/npm
          VERSION="${GITHUB_REF_NAME#v}"
          ARCHIVE_NAME="meidada-cn-cli-$VERSION.tgz"
          test -f "out/npm/$ARCHIVE_NAME"
          sha256sum "out/npm/$ARCHIVE_NAME" > out/npm/SHA256SUMS

      - name: Validate package set
        run: |
          test "$(find out/npm -maxdepth 1 -name '*.tgz' | wc -l)" -eq 7
          node - <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('out/package/package.json', 'utf8'));
          const deps = pkg.optionalDependencies || {};
          const expected = ['@meidada-cn/cli-darwin-arm64','@meidada-cn/cli-darwin-x64','@meidada-cn/cli-linux-arm64','@meidada-cn/cli-linux-x64','@meidada-cn/cli-win32-arm64','@meidada-cn/cli-win32-x64'];
          if (expected.some(name => deps[name] !== pkg.version)) throw new Error('主包平台 optionalDependencies 版本不完整');
          NODE

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" out/npm/*.tgz out/npm/SHA256SUMS out/assets/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" out/npm/*.tgz out/npm/SHA256SUMS out/assets/* --generate-notes --verify-tag
          fi

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          test -n "${NODE_AUTH_TOKEN:-}" || { echo 'NPM_TOKEN secret is empty or missing'; exit 1; }
          printf '//registry.npmjs.org/:_authToken=%s\n' "$NODE_AUTH_TOKEN" > "$HOME/.npmrc"
          npm whoami --registry https://registry.npmjs.org
          for package in out/npm/*-darwin-*.tgz out/npm/*-linux-*.tgz out/npm/*-win32-*.tgz; do
            npm publish "$package" --access public --tag latest
          done
          for package in out/npm/meidada-cn-cli-*.tgz; do
            case "$package" in
              *-darwin-*|*-linux-*|*-win32-*) ;;
              *) npm publish "$package" --access public --tag latest; break ;;
            esac
          done
