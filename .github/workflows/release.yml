name: Release CLI

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-pre.[0-9]+"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun test src

      - name: Typecheck
        run: bun run typecheck

      - name: Build release artifact
        run: bun run release

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PRERELEASE_ARGS=""
          if [[ "$GITHUB_REF_NAME" == *-pre.* ]]; then
            PRERELEASE_ARGS="--prerelease"
          fi
          gh release create "$GITHUB_REF_NAME" out/npm/*.tgz out/npm/SHA256SUMS --generate-notes --verify-tag $PRERELEASE_ARGS

      - name: Publish to npm with provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          DIST_TAG="latest"
          if [[ "$GITHUB_REF_NAME" == *-pre.* ]]; then
            DIST_TAG="pre-production"
          fi
          npm publish out/npm/*.tgz --access public --provenance --tag "$DIST_TAG"
