name: Package Dry Run

on:
  workflow_dispatch:

concurrency:
  group: package-dry-run-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun test src

      - name: Typecheck
        run: bun run typecheck

  native-assets:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-amd64
          - os: macos-latest
            target: darwin-amd64
          - os: macos-latest
            target: darwin-arm64
          - os: ubuntu-latest
            target: linux-amd64
          - os: ubuntu-latest
            target: linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build native asset
        run: bun run build:native-assets
        env:
          MDD_NATIVE_TARGETS: ${{ matrix.target }}
          BUN_TMPDIR: ${{ runner.temp }}
          TMPDIR: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}

      - name: Upload native asset
        uses: actions/upload-artifact@v4
        with:
          name: dry-run-native-${{ matrix.target }}
          path: |
            out/assets/mdd-cli-*
            out/assets/checksums.txt

  package:
    needs: native-assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check package version
        run: GITHUB_REF_NAME= bun scripts/check-release-tag.ts

      - name: Download native assets
        uses: actions/download-artifact@v4
        with:
          pattern: dry-run-native-*
          path: out/native-artifacts

      - name: Assemble release-like assets
        run: |
          mkdir -p out/assets out/npm
          find out/native-artifacts -type f -name 'mdd-cli-*' -exec cp {} out/assets/ \;
          find out/native-artifacts -type f -name checksums.txt -exec cat {} \; | sort > out/assets/checksums.txt
          cp out/assets/checksums.txt checksums.txt
          test "$(find out/assets -type f -name 'mdd-cli-*' | wc -l)" -eq 5

      - name: Build npm package directory
        run: bun run package:dir

      - name: Pack npm package
        run: |
          npm pack ./out/package --ignore-scripts --pack-destination out/npm
          ARCHIVE_NAME="$(ls out/npm/*.tgz | xargs -n 1 basename)"
          sha256sum "out/npm/$ARCHIVE_NAME" > out/npm/SHA256SUMS

      - name: Upload dry-run package
        uses: actions/upload-artifact@v4
        with:
          name: dry-run-package
          path: |
            out/package/**
            out/npm/*.tgz
            out/npm/SHA256SUMS
            out/assets/*
